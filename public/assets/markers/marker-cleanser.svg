<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#FFFFFF"/>
  <!-- Black border (25% border ratio) -->
  <rect x="50" y="50" width="400" height="400" fill="#000000"/>
  <!-- Inner White Region -->
  <rect x="125" y="125" width="250" height="250" fill="#FFFFFF"/>
  <!-- Kanji Glyph for Cleanser -->
  <g fill="#000000">
    <!-- Top horizontal bar -->
    <rect x="165" y="160" width="170" height="22" rx="2"/>
    <!-- Vertical left stem -->
    <rect x="180" y="175" width="20" height="145" rx="2"/>
    <!-- Middle crossbar -->
    <rect x="180" y="225" width="140" height="20" rx="2"/>
    <!-- Center vertical support -->
    <rect x="240" y="175" width="20" height="145" rx="2"/>
    <!-- Right hook stroke -->
    <path d="M300 175 V320 H280 V300 H300 V175 Z"/>
    <!-- Bottom base stroke -->
    <rect x="155" y="315" width="190" height="24" rx="2"/>
  </g>
</svg>